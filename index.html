<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>컬러 채집소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Shippori+Mincho:wght@500&family=Nanum+Myeongjo:wght@700;800&family=Great+Vibes&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f3eff2; --surface:#fbf9fa; --ink:#241d25; --muted:#7a6d77; --line:#e2d9df;
  --accent:#86546f; --accent-ink:#fff; --field:#fff; --shade:rgba(36,29,37,.08);
  --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:"Nanum Myeongjo","Shippori Mincho",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16121a; --surface:#1f1a23; --ink:#ede6eb; --muted:#a3959f; --line:#342b37;
    --accent:#cf9dba; --accent-ink:#1c1519; --field:#18141b; --shade:rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#16121a; --surface:#1f1a23; --ink:#ede6eb; --muted:#a3959f; --line:#342b37;
  --accent:#cf9dba; --accent-ink:#1c1519; --field:#18141b; --shade:rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,34px);letter-spacing:-.01em;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:920px){.layout{grid-template-columns:370px minmax(0,1fr);align-items:start}.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px}
@media (max-width:919px){.panel{order:2}}
.group{display:flex;flex-direction:column;gap:8px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drop{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.drop img,.drop .ph{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}
.drop b{display:block;font-weight:600}
.drop span{color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--ground);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:7px 8px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shade)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=text]:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.colors{display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
.crow{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.chip{font-size:11px;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:99px;padding:2px 8px;white-space:nowrap}
.toggle{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.toggle input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent);flex:none}
.toggle b{display:block;font-weight:600}
.toggle span{color:var(--muted);font-size:12px}
.crow input[type=color]{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0;background:none;cursor:pointer}
.crow input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.crow input[type=color]::-webkit-color-swatch{border:0;border-radius:7px}
.hexbtn{font:500 12px/1 "Montserrat",var(--ui);font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--ground);color:var(--ink);border-radius:7px;padding:8px 9px;cursor:pointer;min-width:84px}
.hexbtn:hover{border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:600;border-radius:9px;padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.stage{display:flex;flex-direction:column;gap:10px;align-items:center}
.canvasbox{width:100%;display:flex;justify-content:center;position:relative}
canvas#out{max-width:100%;height:auto;max-height:82vh;border-radius:6px;box-shadow:0 10px 40px var(--shade),0 1px 2px var(--shade)}
.stage .hint{color:var(--muted);font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet{position:fixed;inset:0;background:rgba(10,8,12,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet .inner{background:var(--surface);border-radius:14px;padding:16px;max-width:520px;width:100%;max-height:100%;display:flex;flex-direction:column;gap:12px}
.sheet img{width:100%;max-height:68vh;object-fit:contain;border-radius:6px;background:var(--ground)}
.sheet p{margin:0;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>컬러 채집소</h1>
    <p>사진을 올리면 대표 색을 뽑아 팔레트 카드로 만들어요. 사진은 이 기기 안에서만 처리돼요.</p>
  </header>

  <div class="layout">
    <section class="panel" aria-label="설정">
      <div class="group">
        <span class="label">사진</span>
        <label class="drop" id="drop" for="file">
          <div class="ph" id="thumbWrap"></div>
          <div><b>사진 올리기</b><span>누르거나 끌어다 놓기 · 붙여넣기도 돼요</span></div>
        </label>
        <input type="file" id="file" accept="image/*" hidden>
      </div>

      <div class="group">
        <span class="label">레이아웃</span>
        <div class="seg" id="styleSeg">
          <button type="button" data-v="sheet" aria-pressed="true">팔레트 시트</button>
          <button type="button" data-v="cards" aria-pressed="false">컬러 카드</button>
        </div>
      </div>

      <div class="group" id="blurGroup" hidden>
        <label class="label" for="blur">배경 흐림 <span id="blurVal">55</span></label>
        <input type="range" id="blur" min="0" max="100" step="1" value="55">
      </div>

      <div class="row2">
        <div class="group">
          <span class="label">색 개수</span>
          <div class="seg" id="countSeg">
            <button type="button" data-v="4" aria-pressed="false">4</button>
            <button type="button" data-v="5" aria-pressed="true">5</button>
            <button type="button" data-v="6" aria-pressed="false">6</button>
          </div>
        </div>
        <div class="group">
          <label class="label" for="sort">순서</label>
          <select id="sort">
            <option value="dark">어두운 색부터</option>
            <option value="light">밝은 색부터</option>
            <option value="share">많이 쓰인 순</option>
          </select>
        </div>
      </div>

      <label class="toggle" for="accent">
        <input type="checkbox" id="accent" checked>
        <div><b>포인트 색 살리기</b><span>눈동자·장신구처럼 면적은 작아도 튀는 색이 있으면 한 칸을 따로 챙겨요</span></div>
      </label>

      <div class="group">
        <label class="label" for="title">제목</label>
        <input type="text" id="title" value="와이퍼에 걸린 가을">
      </div>
      <div class="row2">
        <div class="group">
          <label class="label" for="subtitle">부제</label>
          <input type="text" id="subtitle" value="Autumn Collection">
        </div>
        <div class="group">
          <label class="label" for="sign">서명</label>
          <input type="text" id="sign" value="@my_palette">
        </div>
      </div>

      <div class="group">
        <span class="label">뽑힌 색 · 이름과 색은 직접 고칠 수 있어요</span>
        <div class="colors" id="colors"></div>
      </div>

      <div class="actions">
        <button type="button" class="btn" id="reroll">다른 조합</button>
        <button type="button" class="btn" id="copyAll">HEX 전체 복사</button>
        <button type="button" class="btn primary" id="save">이미지로 저장</button>
      </div>
    </section>

    <section class="stage" aria-label="미리보기">
      <div class="canvasbox"><canvas id="out" width="1080" height="1620"></canvas></div>
      <div class="hint" id="hint">예시 이미지로 보여주는 중이에요. 내 사진을 올리면 바로 바뀌어요.</div>
    </section>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet" id="sheet" hidden>
  <div class="inner">
    <img id="sheetImg" alt="완성된 팔레트 이미지">
    <p>이미지를 길게 누르거나(모바일) 우클릭해서(PC) 저장하세요.</p>
    <button type="button" class="btn" id="sheetClose">닫기</button>
  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const out = $('#out'), ctx = out.getContext('2d');
const state = { src:null, isSample:true, style:'sheet', k:5, sort:'dark', seed:1, accent:true, blur:55, colors:[] };

/* ---------- color math ---------- */
const hex = c => '#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase();
const fromHex = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lin = v => (v/=255)<=.04045?v/12.92:((v+.055)/1.055)**2.4;
const lum = c => .2126*lin(c[0])+.7152*lin(c[1])+.0722*lin(c[2]);
const cmyk = ([r,g,b]) => { r/=255;g/=255;b/=255; const k=1-Math.max(r,g,b); if(k>=1)return[0,0,0,100];
  return [(1-r-k)/(1-k),(1-g-k)/(1-k),(1-b-k)/(1-k),k].map(v=>Math.round(v*100)); };
function hsl([r,g,b]){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2; let h=0,s=0;
  if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h = mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); h*=60; } return [h,s,l]; }
const toLab = c => { const [R,G,B]=c.map(lin); const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
  const x=f((R*.4124+G*.3576+B*.1805)/.95047), y=f(R*.2126+G*.7152+B*.0722), z=f((R*.0193+G*.1192+B*.9505)/1.08883);
  return [116*y-16,500*(x-y),200*(y-z)]; };

function nameFor(c, used){
  const [h,s,l]=hsl(c);
  let noun;
  if(s<.1||(s<.18&&(l<.2||l>.9))) noun = l>.88?'Porcelain':l>.65?'Mist':l>.4?'Ash':l>.18?'Graphite':'Ink';
  else noun = h<12?'Rose':h<25?'Coral':h<40?'Peach':h<52?'Amber':h<66?'Honey':h<90?'Lime':h<150?'Moss':h<185?'Jade':h<205?'Lagoon':h<235?(l<.35?'Indigo':'Sky'):h<262?'Iris':h<285?'Lilac':h<318?'Plum':h<345?'Mauve':'Rose';
  const adjs = l>.86?['Pale','Milky','Faint']:l>.7?['Soft','Powder','Light']:l>.5?(s<.35?['Dusty','Smoky','Hazy']:['Bright','Candy','Clear']):l>.3?['Deep','Muted','Shaded']:l>.14?['Velvet','Cocoa','Dusk']:['Midnight','Velvet','Shadow'];
  for(const a of adjs){ const n=a+' '+noun; if(!used.has(n)){used.add(n);return n;} }
  const n=adjs[0]+' '+noun+' II'; used.add(n); return n;
}

/* ---------- extraction: k-means++ in Lab ---------- */
function extract(src,k,seed){
  const w=140, h=Math.max(1,Math.round(w*(src.height||src.naturalHeight)/(src.width||src.naturalWidth)));
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d',{willReadFrequently:true});
  g.drawImage(src,0,0,w,h); const d=g.getImageData(0,0,w,h).data;
  const px=[], lab=[];
  for(let i=0;i<d.length;i+=4){ if(d[i+3]<128)continue; const p=[d[i],d[i+1],d[i+2]]; px.push(p); lab.push(toLab(p)); }
  let s=seed*9301+49297; const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const avgRGB=idx=>{ const q=[0,0,0]; idx.forEach(i=>{q[0]+=px[i][0];q[1]+=px[i][1];q[2]+=px[i][2];}); return q.map(v=>Math.round(v/idx.length)); };

  let res=kmeans(lab,k,rnd), accent=null;
  // 포인트 색: 채도가 높은데 기존 대표색 어디에도 가깝지 않은 픽셀 묶음을 따로 한 칸 챙김
  if(state.accent && k>=3){
    const chroma=p=>Math.hypot(p[1],p[2]);
    const cand=[];
    for(let i=0;i<lab.length;i++){ const p=lab[i]; if(chroma(p)<28) continue;
      let md=Infinity; for(const c of res.cents){ const d=dist(p,c); if(d<md) md=d; }
      if(md>18*18) cand.push(i); }
    const minN=Math.max(8,Math.round(lab.length*.0015));
    if(cand.length>=minN){
      const sub=cand.map(i=>lab[i]), kk=Math.min(3,sub.length), r2=kmeans(sub,kk,rnd,10);
      let best=-1,bestScore=0,bestIdx=null;
      for(let j=0;j<kk;j++){ const idx=cand.filter((_,n)=>r2.asg[n]===j); if(idx.length<minN) continue;
        const mc=idx.reduce((a,i)=>a+chroma(lab[i]),0)/idx.length, score=idx.length*mc;
        if(score>bestScore){bestScore=score;best=j;bestIdx=idx;} }
      if(best>=0){ accent={rgb:avgRGB(bestIdx),share:bestIdx.length/px.length,accent:true}; res=kmeans(lab,k-1,rnd); }
    }
  }
  const kk=res.cents.length, groups=Array.from({length:kk},()=>[]);
  for(let i=0;i<px.length;i++) groups[res.asg[i]].push(i);
  const list=groups.filter(g=>g.length).map(g=>({rgb:avgRGB(g),share:g.length/px.length}));
  if(accent) list.push(accent);
  return list;
}
const dist=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
function kmeans(lab,k,rnd,iters=16){
  const cents=[lab[Math.floor(rnd()*lab.length)].slice()];
  while(cents.length<k){ const ds=lab.map(p=>{let m=Infinity; for(const c of cents){const d=dist(p,c); if(d<m)m=d;} return m;});
    const tot=ds.reduce((a,b)=>a+b,0); let t=rnd()*tot, idx=0; while(t>0&&idx<ds.length){t-=ds[idx++];} cents.push(lab[Math.max(0,idx-1)].slice()); }
  const asg=new Int32Array(lab.length);
  for(let it=0;it<iters;it++){
    for(let i=0;i<lab.length;i++){ let b=0,bd=Infinity; for(let j=0;j<k;j++){const dd=dist(lab[i],cents[j]); if(dd<bd){bd=dd;b=j;}} asg[i]=b; }
    const sum=Array.from({length:k},()=>[0,0,0,0]);
    for(let i=0;i<lab.length;i++){const q=sum[asg[i]],p=lab[i]; q[0]+=p[0];q[1]+=p[1];q[2]+=p[2];q[3]++;}
    sum.forEach((q,j)=>{ if(q[3]) cents[j]=[q[0]/q[3],q[1]/q[3],q[2]/q[3]]; });
  }
  return {cents,asg};
}

function sortColors(list){
  const L=c=>lum(c.rgb);
  if(state.sort==='dark') list.sort((a,b)=>L(a)-L(b));
  else if(state.sort==='light') list.sort((a,b)=>L(b)-L(a));
  else list.sort((a,b)=>b.share-a.share);
  return list;
}

function recompute(){
  const list = sortColors(extract(state.src,state.k,state.seed));
  const used=new Set();
  state.colors = list.map(c=>({rgb:c.rgb,share:c.share,accent:!!c.accent,name:nameFor(c.rgb,used)}));
  renderList(); draw();
}

/* ---------- canvas helpers ---------- */
function cover(g,img,x,y,w,h){ const iw=img.width||img.naturalWidth, ih=img.height||img.naturalHeight;
  const s=Math.max(w/iw,h/ih), sw=w/s, sh=h/s; g.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h); }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function fit(g,text,font,size,maxW,weight=''){ let sz=size; do{ g.font=`${weight} ${sz}px ${font}`; sz-=1; }while(g.measureText(text).width>maxW&&sz>8); }
const spacing=(g,v)=>{ if('letterSpacing' in g) g.letterSpacing=v; };
const on = c => lum(c)>.36?'#1d1a1e':'#ffffff';

const F = {
  play:'"Playfair Display","Nanum Myeongjo",Georgia,serif',
  mont:'"Montserrat","IBM Plex Sans KR",sans-serif',
  corm:'"Cormorant Garamond","Nanum Myeongjo",Georgia,serif',
  mincho:'"Shippori Mincho","Nanum Myeongjo",serif',
  script:'"Great Vibes",cursive'
};

/* ---------- layout: palette sheet (736 x 1104 logical) ---------- */
function drawSheet(){
  out.width=1080; out.height=1620; const s=1080/736;
  ctx.setTransform(s,0,0,s,0,0);
  const cols=state.colors.map(c=>c.rgb);
  const darkest=[...cols].sort((a,b)=>lum(a)-lum(b));
  const light=darkest[darkest.length-1];
  const paper=[0,1,2].map(i=>Math.round(light[i]*.18+[244,242,241][i]*.82));
  ctx.fillStyle=hex(paper); ctx.fillRect(0,0,736,1104);
  // paper grain
  let sd=3; const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let i=0;i<5000;i++){ ctx.fillStyle=`rgba(0,0,0,${r()*.035})`; ctx.fillRect(r()*736,r()*1104,1,1); }
  const ink=hex(darkest[0]), inkSoft='rgba(40,34,38,.62)';
  ctx.textAlign='center'; ctx.fillStyle=inkSoft; spacing(ctx,'2px');
  ctx.font=`500 14px ${F.corm}`; ctx.fillText('Color Palette',368,62);
  spacing(ctx,'7px'); ctx.fillStyle='#2b2629';
  fit(ctx,$('#title').value||' ',F.mincho,46,660,'500'); ctx.fillText($('#title').value,368,132);
  spacing(ctx,'0px');
  // photo
  cover(ctx,state.src,30,193,440,368);
  // swatch stack
  const n=cols.length, gap=9, sh=(368-gap*(n-1))/n;
  cols.forEach((c,i)=>{ const y=193+i*(sh+gap); ctx.fillStyle=hex(c); ctx.fillRect(485,y,222,sh);
    ctx.fillStyle=on(c); ctx.textAlign='right'; ctx.font=`italic 500 13px ${F.corm}`; ctx.fillText(hex(c).toLowerCase(),700,y+sh-8); });
  // gradient pills
  const pairs=[[darkest[0],darkest[Math.min(2,n-1)]],[darkest[Math.min(3,n-1)],darkest[1]],[light,darkest[0]]];
  pairs.forEach(([a,b],i)=>{ const y=598+i*79; const gr=ctx.createLinearGradient(30,0,426,0);
    gr.addColorStop(0,hex(a)); gr.addColorStop(1,hex(b)); ctx.fillStyle=gr; rr(ctx,30,y,396,62,31); ctx.fill();
    ctx.font=`italic 500 13px ${F.corm}`; ctx.textAlign='left'; ctx.fillStyle=on(a); ctx.fillText(hex(a).toLowerCase(),48,y+36);
    ctx.textAlign='right'; ctx.fillStyle=on(b); ctx.fillText(hex(b).toLowerCase(),408,y+36); });
  // samples
  [darkest[0],darkest[Math.min(2,n-1)],darkest[Math.min(3,n-1)]].forEach((c,i)=>{ const y=648+i*79;
    ctx.save(); ctx.translate(503,y-22); ctx.rotate(-.12); ctx.textAlign='left';
    ctx.fillStyle='rgba(60,52,58,.45)'; ctx.font=`17px ${F.script}`; ctx.fillText('Color Palette',0,0); ctx.restore();
    const code=hex(c).toLowerCase(); ctx.textAlign='left'; ctx.fillStyle=hex(c); fit(ctx,code,F.corm,40,188,'500'); ctx.fillText(code,522,y); });
  // info blocks
  const bw=677/n;
  cols.forEach((c,i)=>{ const x=30+i*bw, y=855; ctx.fillStyle=hex(c); ctx.fillRect(x,y,bw+.5,147);
    const t=on(c), small=lum(c)>.36?'rgba(29,26,30,.7)':'rgba(255,255,255,.72)';
    ctx.textAlign='left'; ctx.fillStyle=small; ctx.font=`500 7.5px ${F.mont}`;
    ctx.fillText('RGB',x+7,y+14); ctx.fillText(c.join(' '),x+7,y+25);
    ctx.fillText('CMYK',x+7,y+44); ctx.fillText(cmyk(c).join(' '),x+7,y+55);
    ctx.save(); ctx.translate(x+bw-9,y+8); ctx.rotate(Math.PI/2); ctx.fillStyle=small; ctx.font=`italic 500 11px ${F.corm}`; ctx.fillText(hex(c).toLowerCase(),0,0); ctx.restore();
    ctx.fillStyle=t; fit(ctx,state.colors[i].name,F.corm,19,bw-14,'700'); ctx.fillText(state.colors[i].name,x+7,y+118);
    ctx.fillStyle=small; ctx.font=`500 7.5px ${F.mont}`; ctx.fillText($('#subtitle').value,x+7,y+134); });
  // signature
  ctx.textAlign='center'; ctx.fillStyle=inkSoft; ctx.font=`italic 500 13px ${F.corm}`; spacing(ctx,'1px');
  ctx.fillText($('#sign').value,368,1070); spacing(ctx,'0px');
  ctx.setTransform(1,0,0,1,0,0);
}

/* ---------- layout: colour cards (1080 x 1920) ---------- */
function drawCards(){
  out.width=1080; out.height=1920; ctx.setTransform(1,0,0,1,0,0);
  cover(ctx,state.src,0,0,1080,1920);
  // 뿌연 블러: 작게 줄였다가 단계적으로 키우는 방식 (모든 브라우저·저장 이미지에서 똑같이 보임)
  const a=state.blur/100;
  if(a>0){
    const f=2+a*26, w=Math.max(6,Math.round(1080/f)), h=Math.max(10,Math.round(1920/f));
    const sm=document.createElement('canvas'); sm.width=w; sm.height=h;
    const sg=sm.getContext('2d'); sg.imageSmoothingQuality='high'; cover(sg,state.src,0,0,w,h);
    let cur=sm;
    while(cur.width*3<1080){ const nx=document.createElement('canvas'); nx.width=cur.width*3; nx.height=cur.height*3;
      const ng=nx.getContext('2d'); ng.imageSmoothingQuality='high'; ng.drawImage(cur,0,0,nx.width,nx.height); cur=nx; }
    ctx.imageSmoothingQuality='high'; ctx.drawImage(cur,0,0,1080,1920);
  }
  ctx.fillStyle=`rgba(255,255,255,${.06+a*.2})`; ctx.fillRect(0,0,1080,1920);
  const cols=state.colors, n=cols.length, ch=n>5?180:200, gap=18, total=n*ch+(n-1)*gap;
  let y=Math.round((1920-total)/2)-40;
  cols.forEach(c=>{ const rgb=c.rgb, t=on(rgb), sub=lum(rgb)>.36?'rgba(29,26,30,.55)':'rgba(255,255,255,.6)';
    ctx.fillStyle=hex(rgb); rr(ctx,160,y,760,ch,22); ctx.fill();
    ctx.textAlign='left'; ctx.fillStyle=t; fit(ctx,c.name.toUpperCase(),F.play,54,700,'900'); ctx.fillText(c.name.toUpperCase(),190,y+ch*.36);
    ctx.fillStyle=lum(rgb)>.36?'rgba(29,26,30,.18)':'rgba(255,255,255,.22)'; ctx.fillRect(190,y+ch*.43,700,1.5);
    const ly=y+ch*.61, vy=y+ch*.76;
    [['HEX',hex(rgb).slice(1),190],['RGB',rgb.join(', '),449],['CMYK',cmyk(rgb).map(v=>v+'%').join(', '),677]].forEach(([l,v,x])=>{
      ctx.fillStyle=sub; ctx.font=`500 17px ${F.mont}`; ctx.fillText(l,x,ly);
      ctx.fillStyle=t; ctx.font=`500 21px ${F.mont}`; ctx.fillText(v,x,vy); });
    y+=ch+gap; });
  // footer
  const fy=1920-110;
  for(let i=0;i<n;i++){ ctx.fillStyle=i===0?'rgba(255,255,255,.95)':'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(540+(i-(n-1)/2)*18,fy-44,4.5,0,Math.PI*2); ctx.fill(); }
  ctx.textAlign='center'; ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=12;
  ctx.fillStyle='rgba(255,255,255,.92)'; fit(ctx,$('#title').value,F.play,34,800,'700'); ctx.fillText($('#title').value,540,fy);
  ctx.font=`500 18px ${F.mont}`; ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fillText($('#sign').value,540,fy+36);
  ctx.shadowBlur=0;
}

function draw(){ if(!state.src||!state.colors.length)return; state.style==='sheet'?drawSheet():drawCards(); }

/* ---------- panel list ---------- */
function renderList(){
  const box=$('#colors'); box.innerHTML='';
  state.colors.forEach((c,i)=>{
    const row=document.createElement('div'); row.className='crow';
    row.innerHTML=`<input type="color" id="col${i}" aria-label="${i+1}번 색 바꾸기" value="${hex(c.rgb).toLowerCase()}">
      <input type="text" id="name${i}" aria-label="${i+1}번 색 이름" value="${c.name.replace(/"/g,'&quot;')}">
      ${c.accent?'<span class="chip" title="면적은 작지만 눈에 띄는 색이라 따로 챙겼어요">포인트</span>':'<span></span>'}
      <button type="button" class="hexbtn" title="복사">${hex(c.rgb)}</button>`;
    const [picker,name,,btn]=row.children;
    picker.addEventListener('input',()=>{ c.rgb=fromHex(picker.value); btn.textContent=hex(c.rgb); draw(); });
    name.addEventListener('input',()=>{ c.name=name.value; draw(); });
    btn.addEventListener('click',()=>copy(hex(c.rgb),`${hex(c.rgb)} 복사했어요`));
    box.appendChild(row);
  });
}

/* ---------- utils ---------- */
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1600); }
function copy(text,msg){ const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast(msg);}catch(e){toast('복사가 막혀 있어요. 직접 선택해 주세요');} ta.remove(); };
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(fallback); else fallback(); }

function loadFile(file){
  if(!file||!file.type.startsWith('image/')){ toast('이미지 파일만 올릴 수 있어요'); return; }
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{ state.src=img; state.isSample=false; state.seed=1;
      $('#thumbWrap').outerHTML=`<img id="thumbWrap" src="${fr.result}" alt="">`;
      $('#hint').textContent='마음에 안 드는 색은 왼쪽에서 직접 바꾸거나 “다른 조합”을 눌러보세요.';
      recompute(); }; img.src=fr.result; };
  fr.readAsDataURL(file);
}

/* ---------- events ---------- */
$('#file').addEventListener('change',e=>loadFile(e.target.files[0]));
const drop=$('#drop'), stage=document.querySelector('.stage');
[drop,stage].forEach(el=>{
  el.addEventListener('dragover',e=>{e.preventDefault(); drop.classList.add('over');});
  el.addEventListener('dragleave',()=>drop.classList.remove('over'));
  el.addEventListener('drop',e=>{e.preventDefault(); drop.classList.remove('over'); loadFile(e.dataTransfer.files[0]);});
});
document.addEventListener('paste',e=>{ const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/')); if(f) loadFile(f); });

function seg(id,key,cb){ const el=$(id); el.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); state[key]=key==='k'?+b.dataset.v:b.dataset.v; cb(); }); }
seg('#styleSeg','style',()=>{ $('#blurGroup').hidden=state.style!=='cards'; draw(); });
$('#blur').addEventListener('input',e=>{ state.blur=+e.target.value; $('#blurVal').textContent=state.blur; draw(); });
seg('#countSeg','k',recompute);
$('#accent').addEventListener('change',e=>{ state.accent=e.target.checked; recompute();
  if(state.accent) toast(state.colors.some(c=>c.accent)?'포인트 색을 따로 챙겼어요':'따로 챙길 만큼 튀는 색은 없었어요'); });
$('#sort').addEventListener('change',e=>{ state.sort=e.target.value; sortColors(state.colors); renderList(); draw(); });
['#title','#subtitle','#sign'].forEach(s=>$(s).addEventListener('input',draw));
$('#reroll').addEventListener('click',()=>{ state.seed++; recompute(); toast('다른 조합으로 뽑았어요'); });
$('#copyAll').addEventListener('click',()=>copy(state.colors.map(c=>hex(c.rgb)).join(' '),'HEX 전체 복사했어요'));
$('#save').addEventListener('click',()=>{ $('#sheetImg').src=out.toDataURL('image/png'); $('#sheet').hidden=false; });
$('#sheetClose').addEventListener('click',()=>$('#sheet').hidden=true);
$('#sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') $('#sheet').hidden=true; });
